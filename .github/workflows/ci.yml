name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A new push to a pull request cancels its older, now pointless run. Runs on main and tags
# always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The GnuPG interop tests are a release gate: fail instead of skipping when gpg is missing.
  WATERMELON_REQUIRE_GPG: "1"

jobs:
  # Which parts of the repository a pull request touches. Pushes to main and tags skip the
  # filter and report every part as changed, so every job runs. Website-only changes are
  # checked by pages.yml.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true' }}
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - "crates/**"
              - "*.toml"
              - "Cargo.lock"
              - ".cargo/**"
              - ".github/workflows/ci.yml"
            e2e:
              - "e2e/**"
            docker:
              - "Dockerfile"
              - ".dockerignore"
              - "contrib/**"

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --release -- -D warnings
      # Debug builds add the /styleguide page.
      - run: cargo clippy --all-targets -- -D warnings

  # Runner images: Ubuntu 24.04 (GnuPG 2.4.4), latest Ubuntu (GnuPG 2.4.8 + libgcrypt 1.12.0,
  # see README "Known issues"), macOS (current GnuPG from Homebrew), Windows (GnuPG from
  # Gpg4win, what Windows partners run).
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install GnuPG (macOS)
        if: runner.os == 'macOS'
        run: brew install gnupg
      # Gpg4win straight from gpg4win.org: Chocolatey's feed timed out or hung for 25+ minutes.
      # The installer is cached, so most runs don't download it. To update: download the new
      # gpg4win-X.exe and .sig from files.gpg4win.org, check the signature against a GnuPG
      # release key from gnupg.org/signature_key.html, and pin its SHA-256 here.
      - name: Cache the Gpg4win installer
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gpg4win
          key: gpg4win-5.1.2
      - name: Install GnuPG (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        env:
          GPG4WIN_VERSION: "5.1.2"
          GPG4WIN_SHA256: 6bd36865f951c299e559ecb891f22e19b6fa0f4dfedc596f73d259f8365408eb
        run: |
          $dir = "$env:RUNNER_TEMP\gpg4win"
          $exe = "$dir\gpg4win-$env:GPG4WIN_VERSION.exe"
          if (-not (Test-Path $exe)) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WebRequest "https://files.gpg4win.org/gpg4win-$env:GPG4WIN_VERSION.exe" `
              -OutFile $exe -MaximumRetryCount 3 -RetryIntervalSec 5
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne $env:GPG4WIN_SHA256) { throw "gpg4win installer SHA-256 mismatch: $hash" }
          $p = Start-Process $exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "gpg4win installer exited with $($p.ExitCode)" }
          # Put it ahead of the gpg bundled with Git for Windows.
          $bin = @("$env:ProgramFiles\GnuPG\bin", "${env:ProgramFiles(x86)}\GnuPG\bin") |
            Where-Object { Test-Path "$_\gpg.exe" } | Select-Object -First 1
          if (-not $bin) { throw "gpg.exe not found after installing Gpg4win" }
          Add-Content $env:GITHUB_PATH $bin
      - run: gpg --version
      # The lint job runs on Linux only; this catches warnings in Windows-only code.
      - name: Clippy (Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --all-targets --release -- -D warnings
      - run: cargo test --release

  # Further GnuPG versions partners are likely to run: 2.2 (Debian 12) and the newest 2.4.
  test-gnupg:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "debian:testing"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools and GnuPG
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl build-essential git gnupg gpg-agent
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.image }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: gpg --version
      - run: cargo test --release

  # The core user flows in a real browser (Playwright, Chromium) against a real binary.
  # Debug build, so the style guide is checked too.
  e2e:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - name: Keep the report and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  # The oldest Rust the workspace claims to support (rust-version in Cargo.toml).
  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  # Known vulnerabilities in dependencies (RustSec advisory database).
  audit:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  docker:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t watermelon-pgp:ci .
      - name: Smoke test the image
        run: |
          echo "ci smoke test password" \
            | docker run --rm -i -v wm-data:/data watermelon-pgp:ci --passphrase-stdin init
          docker run -d --name wm -p 127.0.0.1:8080:8080 -v wm-data:/data watermelon-pgp:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/healthz | grep -q '"ok"'
          test "$(docker exec wm id -u)" = 10001
          docker stop wm
          docker logs wm
          test "$(docker inspect wm --format '{{.State.ExitCode}}')" = 0

  # The one check to require in the ruleset: green when every job passed or was skipped
  # because the change can't affect it, red when any job failed or was cancelled.
  ci-ok:
    needs: [changes, lint, test, test-gnupg, e2e, msrv, audit, docker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Some jobs failed or were cancelled."
          exit 1
      - run: echo "All needed jobs passed or were skipped."
