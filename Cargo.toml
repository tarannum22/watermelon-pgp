[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tarannum22/watermelon-pgp"
rust-version = "1.88"

[workspace.dependencies]
watermelon-pgp-core = { path = "crates/watermelon-pgp-core" }
pgp = "0.21.1"
rand = "0.8.6"
rsa = "0.9"
smallvec = "1.16"
rusqlite = { version = "0.43", features = ["bundled"] }
chacha20poly1305 = "0.10.1"
argon2 = { version = "0.5.3", features = ["std"] }
zeroize = "1.9"
hex = "0.4"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
rpassword = "7.5"
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
