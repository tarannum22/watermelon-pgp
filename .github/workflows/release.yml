# Publishes a release when a version tag (vX.Y.Z) is pushed. The steps before and after,
# including tagging, are in docs/releasing.md; this workflow only builds and publishes.
#
# Dry run: start it by hand (Actions > Release > Run workflow, or `gh workflow run release.yml`).
# It builds and packages all five targets (the Windows zip is smoke-tested), checksums them,
# writes the release notes and the Homebrew formula, builds the image for both platforms, and
# builds and smoke-tests the MSI installer and the Chocolatey package (install, upgrade with the
# service running, uninstall), all as v<version in Cargo.toml>.
# It publishes nothing: no GitHub release, no image push, no tap update, no Chocolatey push.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      # A failed target fails the release, Windows included: the zip is in the
      # release notes and SHA256SUMS, and the dry run on the release branch catches it first.
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04 for an older glibc (2.35), so the binary runs on more distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Intel Macs, cross-compiled on Apple silicon.
          - target: x86_64-apple-darwin
            os: macos-latest
          # A zip instead of a tarball.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Release tag (checked against the crate version)
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$version"
            echo "Dry run: packaging $tag from $GITHUB_REF_NAME"
          else
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
            tag=$GITHUB_REF_NAME
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      # Saved by dry runs only: repeated dry runs on a release branch reuse it. A tag run can't
      # restore a branch's cache, and nothing reuses a tag's, so it doesn't save one.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - run: cargo build --release --locked --bin watermelonpgp --target ${{ matrix.target }}
        env:
          # Windows: link the C runtime statically, so no Visual C++ redistributable is needed.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      - name: Package
        shell: bash
        run: |
          name="watermelon-pgp-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin=watermelonpgp
          if [ "$RUNNER_OS" = Windows ]; then bin=watermelonpgp.exe; fi
          cp "target/${{ matrix.target }}/release/$bin" README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -R contrib docs "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a -tzip -bso0 -bsp0 "$name.zip" "$name")
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
      # Check what ships, from the unpacked zip: the version, init and serve, and no DLL
      # dependency on the C runtime (VCRUNTIME140.dll, api-ms-win-crt-*, ucrtbase.dll).
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $name = "watermelon-pgp-$env:TAG-${{ matrix.target }}"
          Expand-Archive "dist\$name.zip" "$env:RUNNER_TEMP\unpacked"
          $root = "$env:RUNNER_TEMP\unpacked\$name"
          $exe = "$root\watermelonpgp.exe"
          foreach ($entry in "watermelonpgp.exe", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "contrib", "docs") {
            if (-not (Test-Path "$root\$entry")) { throw "the zip has no $name\$entry" }
          }
          Get-ChildItem $root | Select-Object -ExpandProperty Name

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $deps = & $dumpbin /nologo /dependents $exe
          $deps
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed" }
          # Every Windows program imports KERNEL32.dll: without it the output isn't a list.
          if (-not ($deps | Select-String -Pattern '^\s+KERNEL32\.dll\s*$')) { throw "no dependency list from dumpbin" }
          $crt = $deps | Select-String -Pattern '^\s+(vcruntime|msvcp|api-ms-win-crt|ucrtbase)\S*\.dll\s*$'
          if ($crt) { throw "watermelonpgp.exe needs the C runtime DLLs: $crt" }

          $version = & $exe --version
          $version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          if ($version -cne "watermelonpgp $($env:TAG.TrimStart('v'))") { throw "--version does not match $env:TAG" }

          $data = "$env:RUNNER_TEMP\wm-data"
          "release smoke test password" | & $exe --data-dir $data --passphrase-stdin init
          if ($LASTEXITCODE -ne 0) { throw "init failed" }
          $log = "$env:RUNNER_TEMP\serve"
          $serve = Start-Process $exe -ArgumentList "--data-dir", $data, "serve", "--bind", "127.0.0.1:8080" `
            -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err" -PassThru -NoNewWindow
          try {
            $health = $null
            foreach ($i in 1..30) {
              try { $health = (Invoke-WebRequest http://127.0.0.1:8080/healthz).Content; break } catch { Start-Sleep 1 }
            }
            "/healthz: $health"
            if ($health -ne '{"status":"ok"}') { throw "/healthz did not answer ok" }
          } finally {
            Stop-Process -Id $serve.Id -Force -ErrorAction SilentlyContinue
            Get-Content "$log.out", "$log.err" -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The Windows installer (packaging/msi), from the Windows zip already built: no second Rust
  # build. WiX and its Util extension are pinned packages from nuget.org, checked against the
  # SHA-256s below on every run; WiX is installed from that checked copy only. The smoke test
  # installs the MSI silently, upgrades it with the service running and uninstalls it, in the
  # dry run too. It upgrades from the newest earlier release's MSI, or, while no earlier release
  # has one, from the same files built as 0.0.1.
  # To update WiX: change WIX_VERSION and both hashes (shasum -a 256 of
  # https://api.nuget.org/v3-flatcontainer/<id>/<version>/<id>.<version>.nupkg).
  msi:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.build.outputs.tag }}
      WIX_VERSION: 5.0.2
      WIX_SHA256: f30ef0c74e2a986126539c5780be93ac24e8136eaf723b1937b26272703ae173
      WIX_UTIL_SHA256: dda1cc1b4d3b2305b1246f167c6af6fcded5000be84b3bbff3dda4f442bf4740
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: x86_64-pc-windows-msvc
          path: dist
      # Saved by dry runs only, like the Rust cache: nothing reuses a tag's.
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\wix-packages
          key: wix-${{ env.WIX_VERSION }}
      - name: Install WiX
        timeout-minutes: 5
        shell: pwsh
        run: |
          $packages = "$env:RUNNER_TEMP\wix-packages"
          New-Item -ItemType Directory -Force $packages | Out-Null
          foreach ($pkg in @(@('wix', $env:WIX_SHA256), @('wixtoolset.util.wixext', $env:WIX_UTIL_SHA256))) {
            $file = "$packages\$($pkg[0]).$env:WIX_VERSION.nupkg"
            if (-not (Test-Path $file)) {
              Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$($pkg[0])/$env:WIX_VERSION/$($pkg[0]).$env:WIX_VERSION.nupkg" `
                -OutFile $file -MaximumRetryCount 3 -RetryIntervalSec 5
            }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash
            if ($hash -ne $pkg[1]) { throw "$file SHA-256 mismatch: $hash" }
          }
          # Only the checked packages as a source.
          Set-Content "$packages\nuget.config" '<configuration><packageSources><clear /><add key="local" value="." /></packageSources></configuration>'
          dotnet tool install wix --version $env:WIX_VERSION --tool-path "$env:RUNNER_TEMP\wix" --configfile "$packages\nuget.config"
          if ($LASTEXITCODE -ne 0) { throw "installing WiX failed" }
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\wix"
          # A .nupkg is a zip; Expand-Archive only takes the .zip extension.
          [IO.Compression.ZipFile]::ExtractToDirectory("$packages\wixtoolset.util.wixext.$env:WIX_VERSION.nupkg", "$env:RUNNER_TEMP\wix-util")
      - uses: actions/cache/save@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          path: ${{ runner.temp }}\wix-packages
          key: wix-${{ env.WIX_VERSION }}
        continue-on-error: true
      - name: Build the MSI
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wix --version
          $ext = "$env:RUNNER_TEMP\wix-util\wixext5\WixToolset.Util.wixext.dll"
          $name = "watermelon-pgp-$env:TAG-x86_64-pc-windows-msvc"
          Expand-Archive "dist\$name.zip" "$env:RUNNER_TEMP\unpacked"
          $payload = "$env:RUNNER_TEMP\unpacked\$name"
          $version = $env:TAG.TrimStart('v')
          packaging\msi\build.ps1 -Version $version -Payload $payload -UtilExtension $ext -Out "dist\$name.msi"

          # The version to upgrade from: the newest release before this one, if it has an MSI.
          $previous = "$env:RUNNER_TEMP\previous"
          New-Item -ItemType Directory -Force $previous | Out-Null
          $tags = gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw "gh release list failed" }
          $tag = $tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' -and [version]$_.TrimStart('v') -lt [version]$version } |
            Sort-Object { [version]$_.TrimStart('v') } -Descending | Select-Object -First 1
          $assets = if ($tag) { gh release view $tag --json assets --jq '.assets[].name' } else { @() }
          if ($LASTEXITCODE -ne 0) { throw "gh release view $tag failed" }
          if ($assets -like '*.msi') {
            gh release download $tag --pattern '*.msi' --dir $previous
            if ($LASTEXITCODE -ne 0) { throw "downloading the $tag MSI failed" }
            "Upgrading from the $tag MSI"
          } else {
            "No MSI in the release before this one ($tag); upgrading from the same files built as 0.0.1"
            packaging\msi\build.ps1 -Version 0.0.1 -Payload $payload -UtilExtension $ext -Out "$previous\previous.msi"
          }
      - name: Smoke test install, upgrade and uninstall
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.TrimStart('v')
          $msi = (Resolve-Path "dist\watermelon-pgp-$env:TAG-x86_64-pc-windows-msvc.msi").Path
          $previous = (Get-ChildItem "$env:RUNNER_TEMP\previous\*.msi" | Select-Object -First 1).FullName
          $dir = "$env:ProgramFiles\WatermelonPGP"
          $data = "$env:ProgramData\WatermelonPGP"
          function Invoke-Msi([string]$Verb, [string]$Package, [string]$Log) {
            $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList $Verb, "`"$Package`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\msi-$Log.log`""
            $p.ExitCode
          }
          function Assert-Refused([string]$Log, [string]$Pattern) {
            $line = Select-String -Path "$env:RUNNER_TEMP\msi-$Log.log" -Pattern $Pattern -SimpleMatch | Select-Object -First 1
            if (-not $line) { throw "the MSI log doesn't say why it refused ($Pattern)" }
            "  log: $($line.Line.Trim())"
          }
          # A new shell's Path: what the installer wrote to the registry.
          function Update-Path {
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
              [Environment]::GetEnvironmentVariable('Path', 'User')
          }
          function Get-Entry {
            @(Get-ChildItem HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall |
              Get-ItemProperty | Where-Object { $_.DisplayName -eq 'WatermelonPGP' })
          }
          function Wait-Healthy {
            for ($i = 0; $i -lt 30; $i++) {
              try {
                if ((Invoke-WebRequest http://127.0.0.1:18080/healthz).Content -match '"ok"') { return }
              } catch {}
              Start-Sleep 1
            }
            throw "/healthz did not answer"
          }

          "== Refused while a service runs a 0.3 watermelon.exe"
          New-Service -Name wm-legacy -BinaryPathName "`"$dir\watermelon.exe`" serve" | Out-Null
          $code = Invoke-Msi /i $msi legacy
          sc.exe delete wm-legacy | Out-Null
          if ($code -eq 0) { throw "installed with a 0.3 service in place" }
          Assert-Refused legacy 'WatermelonPGP: the Windows service wm-legacy runs'

          "== Silent install of the previous version ($(Split-Path $previous -Leaf))"
          $code = Invoke-Msi /i $previous previous
          if ($code -ne 0) { throw "installing the previous MSI failed ($code)" }
          Update-Path
          $wm = (Get-Command watermelonpgp).Source
          if ($wm -ne "$dir\watermelonpgp.exe") { throw "watermelonpgp on the Path is $wm" }
          if (Test-Path $data) { throw "the MSI created $data" }
          if (Get-Service watermelonpgp -ErrorAction SilentlyContinue) { throw "the MSI installed a service" }
          "  installed, on the Path, no data directory, no service"

          "== Upgrade to $version while the service runs"
          "release smoke test password" | watermelonpgp --data-dir $data --passphrase-stdin init
          if ($LASTEXITCODE -ne 0) { throw "init failed" }
          watermelonpgp --data-dir $data service install --bind 127.0.0.1:18080
          if ($LASTEXITCODE -ne 0) { throw "service install failed" }
          Start-Service watermelonpgp
          Wait-Healthy
          $code = Invoke-Msi /i $msi upgrade
          if ($code -ne 0) { throw "the upgrade failed ($code)" }
          # The service is stopped before the old version's files are removed.
          $log = Get-Content "$env:RUNNER_TEMP\msi-upgrade.log"
          $stopAt = ($log | Select-String 'Action start [\d:]+: WmStopServices\.' | Select-Object -First 1).LineNumber
          $removeAt = ($log | Select-String 'Action start [\d:]+: RemoveExistingProducts\.' | Select-Object -First 1).LineNumber
          if (-not $stopAt -or -not $removeAt -or $stopAt -gt $removeAt) {
            throw "expected WmStopServices before RemoveExistingProducts in the upgrade log (lines $stopAt, $removeAt)"
          }
          "  WmStopServices (log line $stopAt) runs before RemoveExistingProducts (line $removeAt)"
          $v = & watermelonpgp --version
          if ($v -cne "watermelonpgp $version") { throw "--version: $v" }
          "  --version: $v"
          $entries = Get-Entry
          if ($entries.Count -ne 1 -or $entries[0].DisplayVersion -ne $version) {
            throw "Add/Remove Programs lists: $($entries | ForEach-Object { $_.DisplayVersion })"
          }
          "  Add/Remove Programs: one WatermelonPGP entry, $($entries[0].DisplayVersion)"
          if ((Get-Service watermelonpgp).Status -ne 'Running') { throw "the service is not running after the upgrade" }
          Wait-Healthy
          $stops = [regex]::Matches((Get-Content "$data\watermelonpgp.log" -Raw), 'INFO stopped').Count
          if ($stops -ne 1) { throw "expected 1 clean stop in the log, found $stops" }
          "  service stopped cleanly once and running again, /healthz ok"

          "== Uninstall refused while the service is installed"
          $code = Invoke-Msi /x $msi refused
          if ($code -eq 0) { throw "uninstalling succeeded with the service installed" }
          if (-not (Test-Path "$dir\watermelonpgp.exe")) { throw "the refused uninstall removed watermelonpgp.exe" }
          Assert-Refused refused 'WatermelonPGP: the Windows service watermelonpgp runs'

          "== Uninstall after watermelonpgp service uninstall"
          watermelonpgp service uninstall
          if ($LASTEXITCODE -ne 0) { throw "service uninstall failed" }
          $code = Invoke-Msi /x $msi uninstall
          if ($code -ne 0) { throw "uninstalling failed ($code)" }
          if (Test-Path $dir) { throw "$dir is still there: $(Get-ChildItem $dir -Recurse -Force)" }
          if (Get-Entry) { throw "still in Add/Remove Programs" }
          if (Test-Path HKLM:\SOFTWARE\WatermelonPGP) { throw "HKLM:\SOFTWARE\WatermelonPGP is still there" }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';'
          if ($machinePath | Where-Object { $_.TrimEnd('\') -ieq $dir }) { throw "$dir is still on the Path" }
          foreach ($file in 'watermelonpgp.db', 'master.key') {
            if (-not (Test-Path "$data\$file")) { throw "uninstalling removed $data\$file" }
          }
          "  no files, registry key, Path entry or Add/Remove Programs entry left; data kept"
      - name: MSI and watermelonpgp logs
        if: failure()
        shell: pwsh
        run: |
          foreach ($log in Get-ChildItem "$env:RUNNER_TEMP\msi-*.log" -ErrorAction SilentlyContinue) {
            "== $($log.Name)"
            Get-Content $log | Select-String -Pattern 'WatermelonPGP:|Return value 3|Error|CustomAction' | Select-Object -Last 60
          }
          Get-Content "$env:ProgramData\WatermelonPGP\watermelonpgp.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error

  release:
    needs: [build, msi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz *.zip *.msi > SHA256SUMS && cat SHA256SUMS
      # For the chocolatey job, which builds the package from the same checksums.
      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[?" v "\\]?( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $TAG"; exit 1; }
      - name: Create the release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/*.msi dist/SHA256SUMS \
            --title "$TAG" --notes-file notes.md --verify-tag
      # The homebrew job below needs the published release; the dry run checks the formula here.
      - name: Dry run, no release created
        if: github.event_name == 'workflow_dispatch'
        run: |
          cat notes.md
          packaging/homebrew/formula.sh "${TAG#v}" dist/SHA256SUMS

  image:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "*-linux-gnu"
          merge-multiple: true
      - name: Unpack the Linux binaries
        run: |
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch=${pair%%:*}; target=${pair#*:}
            mkdir -p "dist/linux/$arch"
            tar -xzf "artifacts/watermelon-pgp-${TAG}-${target}.tar.gz" \
              -C "dist/linux/$arch" --strip-components=1 \
              "watermelon-pgp-${TAG}-${target}/watermelonpgp"
          done
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The dry run builds both platforms without --push; the result stays in the build cache.
      - name: Build the image (and push it, except in the dry run)
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          push=(--push)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then push=(); fi
          docker buildx build --target prebuilt --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --label "org.opencontainers.image.licenses=MIT OR Apache-2.0" \
            -t "$image:${TAG#v}" -t "$image:latest" "${push[@]}" .

  # The Chocolatey package (packaging/chocolatey), from the Windows zip already built and the
  # release's SHA256SUMS: no second Rust build. `choco pack` checks the package; the smoke test
  # installs it, upgrades it while the service runs and uninstalls it. On a tag it installs the
  # published package from the GitHub release; the dry run, before any release exists, the same
  # package with a file:// download URL. On a tag it then pushes the package to the community
  # repository if the CHOCOLATEY_API_KEY secret is set (an API key of the package's maintainer
  # account on community.chocolatey.org), and otherwise prints how to push it by hand.
  chocolatey:
    needs: [build, release]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: x86_64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: dist
      - name: Package sources
        timeout-minutes: 2
        shell: bash
        run: |
          packaging/chocolatey/package_test.sh
          packaging/chocolatey/package.sh "${TAG#v}" dist/SHA256SUMS choco/package
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            WATERMELONPGP_DOWNLOAD_BASE="file:///$(cygpath -m "$PWD/dist")" \
              packaging/chocolatey/package.sh "${TAG#v}" dist/SHA256SUMS choco/smoke
          else
            cp -R choco/package choco/smoke
          fi
          cat choco/package/tools/chocolateyInstall.ps1
      - name: choco pack
        timeout-minutes: 3
        shell: pwsh
        run: |
          foreach ($pkg in 'package', 'smoke') {
            choco pack "choco\$pkg\watermelon-pgp.nuspec" --out "choco\$pkg-out" --limit-output
            if ($LASTEXITCODE -ne 0) { throw "choco pack ($pkg) failed" }
          }
          Get-ChildItem choco\package-out
      - name: Smoke test install, upgrade and uninstall
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.TrimStart('v')
          $dir = "$env:ProgramFiles\WatermelonPGP"
          $source = "$PWD\choco\smoke-out"
          $data = "$env:ProgramData\WatermelonPGP"
          # Not named `choco`: function names ignore case, so it would call itself.
          function Invoke-Choco {
            & choco.exe @args -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco $args failed ($LASTEXITCODE)" }
          }
          # A new shell's Path: what the package wrote to the registry.
          function Update-Path {
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
              [Environment]::GetEnvironmentVariable('Path', 'User')
          }
          function Wait-Healthy {
            for ($i = 0; $i -lt 30; $i++) {
              try {
                if ((Invoke-WebRequest http://127.0.0.1:18080/healthz).Content -match '"ok"') { return }
              } catch {}
              Start-Sleep 1
            }
            throw "/healthz did not answer"
          }

          # Install: checksum-verified, on the Path, nothing else set up.
          Invoke-Choco install watermelon-pgp --version $version --source $source
          Update-Path
          $wm = (Get-Command watermelonpgp).Source
          if ($wm -ne "$dir\watermelonpgp.exe") { throw "watermelonpgp on the Path is $wm" }
          $v = & watermelonpgp --version
          if ($v -cne "watermelonpgp $version") { throw "--version: $v" }
          if (Test-Path $data) { throw "the package created $data" }
          if (Get-Service watermelonpgp -ErrorAction SilentlyContinue) { throw "the package installed a service" }

          # Upgrade (a forced reinstall runs the same script) while the service runs: it is
          # stopped cleanly and started again.
          "release smoke test password" | watermelonpgp --data-dir $data --passphrase-stdin init
          if ($LASTEXITCODE -ne 0) { throw "init failed" }
          watermelonpgp --data-dir $data service install --bind 127.0.0.1:18080
          if ($LASTEXITCODE -ne 0) { throw "service install failed" }
          Start-Service watermelonpgp
          Wait-Healthy
          Invoke-Choco install watermelon-pgp --version $version --source $source --force
          if ((Get-Service watermelonpgp).Status -ne 'Running') { throw "the service is not running after the upgrade" }
          Wait-Healthy
          $stops = [regex]::Matches((Get-Content "$data\watermelonpgp.log" -Raw), 'INFO stopped').Count
          if ($stops -ne 1) { throw "expected 1 clean stop in the log, found $stops" }

          # Uninstall refuses while the service runs the program...
          & choco uninstall watermelon-pgp -y --no-progress
          if ($LASTEXITCODE -eq 0) { throw "choco uninstall succeeded with the service installed" }
          if (-not (Test-Path "$dir\watermelonpgp.exe")) { throw "the refused uninstall removed watermelonpgp.exe" }
          # ...and once the service is gone, removes the program and the Path entry, not the data.
          watermelonpgp service uninstall
          if ($LASTEXITCODE -ne 0) { throw "service uninstall failed" }
          Invoke-Choco uninstall watermelon-pgp
          if (Test-Path $dir) { throw "$dir is still there" }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';'
          if ($machinePath | Where-Object { $_.TrimEnd('\') -ieq $dir }) { throw "$dir is still on the Path" }
          foreach ($file in 'watermelonpgp.db', 'master.key') {
            if (-not (Test-Path "$data\$file")) { throw "uninstall removed $data\$file" }
          }
      - name: Chocolatey and watermelonpgp logs
        if: failure()
        shell: pwsh
        run: |
          Get-Content "$env:ProgramData\chocolatey\logs\chocolatey.log" -Tail 150 -ErrorAction SilentlyContinue
          Get-Content "$env:ProgramData\WatermelonPGP\watermelonpgp.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: chocolatey
          path: choco/package-out/*.nupkg
          if-no-files-found: error
      - name: Push to the Chocolatey community repository
        if: github.event_name != 'workflow_dispatch'
        timeout-minutes: 3
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $nupkg = "choco\package-out\watermelon-pgp.$($env:TAG.TrimStart('v')).nupkg"
          if (-not $env:CHOCOLATEY_API_KEY) {
            "::warning::CHOCOLATEY_API_KEY is not set; push the package by hand (docs/releasing.md):"
            "  gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name chocolatey"
            "  choco push $(Split-Path $nupkg -Leaf) --source https://push.chocolatey.org/ --api-key <key>"
            exit 0
          }
          choco push $nupkg --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) { throw "choco push failed" }

  # Update the Homebrew tap (github.com/tarannum22/homebrew-tap). Needs a repository secret
  # HOMEBREW_TAP_TOKEN: a fine-grained token with contents read/write on the tap repository.
  # Without it this job only prints the formula, to be committed by hand. Skipped in the dry run.
  homebrew:
    needs: release
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS
          packaging/homebrew/formula.sh "${GITHUB_REF_NAME#v}" SHA256SUMS > watermelon-pgp.rb
          cat watermelon-pgp.rb
      - name: Push to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; update the tap by hand with the formula above"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp watermelon-pgp.rb tap/Formula/watermelon-pgp.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/watermelon-pgp.rb
          git commit -m "watermelon-pgp ${GITHUB_REF_NAME#v}"
          git push
