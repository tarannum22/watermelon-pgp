# Publishes a release when a version tag is pushed: `git tag v0.1.0 && git push origin v0.1.0`.
# Tag a commit whose CI run is green; this workflow only builds and publishes.
#
# Dry run: start it by hand (Actions > Release > Run workflow, or `gh workflow run release.yml`).
# It builds and packages all four targets, checksums them, writes the release notes and the
# Homebrew formula, and builds the image for both platforms, all as v<version in Cargo.toml>.
# It publishes nothing: no GitHub release, no image push, no tap update.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04 for an older glibc (2.35), so the binary runs on more distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Intel Macs, cross-compiled on Apple silicon.
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Release tag (checked against the crate version)
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$version"
            echo "Dry run: packaging $tag from $GITHUB_REF_NAME"
          else
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
            tag=$GITHUB_REF_NAME
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --bin watermelon --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="watermelon-pgp-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/watermelon" README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -R contrib docs "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[?" v "\\]?( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $TAG"; exit 1; }
      - name: Create the release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --title "$TAG" --notes-file notes.md --verify-tag
      # The homebrew job below needs the published release; the dry run checks the formula here.
      - name: Dry run, no release created
        if: github.event_name == 'workflow_dispatch'
        run: |
          cat notes.md
          packaging/homebrew/formula.sh "${TAG#v}" dist/SHA256SUMS

  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Unpack the Linux binaries
        run: |
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch=${pair%%:*}; target=${pair#*:}
            mkdir -p "dist/linux/$arch"
            tar -xzf "artifacts/watermelon-pgp-${TAG}-${target}.tar.gz" \
              -C "dist/linux/$arch" --strip-components=1 \
              "watermelon-pgp-${TAG}-${target}/watermelon"
          done
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The dry run builds both platforms without --push; the result stays in the build cache.
      - name: Build the image (and push it, except in the dry run)
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          push=(--push)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then push=(); fi
          docker buildx build --target prebuilt --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --label "org.opencontainers.image.licenses=MIT OR Apache-2.0" \
            -t "$image:${TAG#v}" -t "$image:latest" "${push[@]}" .

  # Update the Homebrew tap (github.com/tarannum22/homebrew-tap). Needs a repository secret
  # HOMEBREW_TAP_TOKEN: a fine-grained token with contents read/write on the tap repository.
  # Without it this job only prints the formula, to be committed by hand. Skipped in the dry run.
  homebrew:
    needs: release
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS
          packaging/homebrew/formula.sh "${GITHUB_REF_NAME#v}" SHA256SUMS > watermelon-pgp.rb
          cat watermelon-pgp.rb
      - name: Push to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; update the tap by hand with the formula above"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp watermelon-pgp.rb tap/Formula/watermelon-pgp.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/watermelon-pgp.rb
          git commit -m "watermelon-pgp ${GITHUB_REF_NAME#v}"
          git push
