name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A new push to a pull request cancels its older, now pointless run. Runs on main and tags
# always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The GnuPG interop tests are a release gate: fail instead of skipping when gpg is missing.
  WATERMELON_REQUIRE_GPG: "1"

jobs:
  # Which parts of the repository a pull request touches. Pushes to main and tags skip the
  # filter and report every part as changed, so every job runs. Website-only changes are
  # checked by pages.yml.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true' }}
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - "crates/**"
              - "*.toml"
              - "Cargo.lock"
              - ".cargo/**"
              - ".github/workflows/ci.yml"
            e2e:
              - "e2e/**"
            docker:
              - "Dockerfile"
              - ".dockerignore"
              - "contrib/**"

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --release -- -D warnings
      # Debug builds add the /styleguide page.
      - run: cargo clippy --all-targets -- -D warnings

  # Runner images: Ubuntu 24.04 (GnuPG 2.4.4), latest Ubuntu (GnuPG 2.4.8 + libgcrypt 1.12.0,
  # see README "Known issues"), macOS (current GnuPG from Homebrew), Windows (GnuPG's own
  # Windows build, the one Gpg4win bundles).
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Windows: GnuPG's own Windows build from gnupg.org (see "Install GnuPG (Windows)").
      GNUPG_INSTALLER: gnupg-w32-2.5.24_20260923.exe
      GNUPG_SHA256: ea6f9dee2cccd83287432625b8b399173805add81d27067fcaf019c0c4da1ad8
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install GnuPG (macOS)
        if: runner.os == 'macOS'
        run: brew install gnupg
      # GnuPG's own Windows build from gnupg.org: the GnuPG that Gpg4win bundles, without
      # Kleopatra and the rest, 6 MB instead of 45. The installer is cached. To update:
      # download the new gnupg-w32-X.exe and .sig from gnupg.org/ftp/gcrypt/binary, check the
      # signature against a key from gnupg.org/signature_key.html, and pin its name and
      # SHA-256 in the job's env. 2.5.24 is signed by "Werner Koch (dist signing 2020)",
      # 6DAA 6E64 A76D 2840 571B  4902 5288 97B8 2640 3ADA.
      - name: Cache the GnuPG installer
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gnupg-installer
          key: ${{ env.GNUPG_INSTALLER }}
      - name: Install GnuPG (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\gnupg-installer"
          $exe = "$dir\$env:GNUPG_INSTALLER"
          if (-not (Test-Path $exe)) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WebRequest "https://gnupg.org/ftp/gcrypt/binary/$env:GNUPG_INSTALLER" `
              -OutFile $exe -MaximumRetryCount 3 -RetryIntervalSec 5
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne $env:GNUPG_SHA256) { throw "GnuPG installer SHA-256 mismatch: $hash" }
          # Unpack rather than run the installer: every installer we tried (Gpg4win via
          # Chocolatey and directly, gnupg-w32) hung in silent mode on this runner. GnuPG finds
          # its files relative to gpg.exe, so the unpacked tree works as is.
          $target = "$env:RUNNER_TEMP\gnupg"
          & "$env:ProgramFiles\7-Zip\7z.exe" x $exe "-o$target" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed to unpack the GnuPG installer" }
          if (-not (Test-Path "$target\bin\gpg.exe")) {
            Get-ChildItem $target -Recurse -Depth 1 | Select-Object -ExpandProperty FullName
            throw "gpg.exe not found in $target\bin"
          }
          # Put it ahead of the gpg bundled with Git for Windows.
          Add-Content $env:GITHUB_PATH "$target\bin"
      - run: gpg --version
      # Fail rather than quietly test against the gpg bundled with Git for Windows.
      - name: Check gpg is the pinned GnuPG (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gpg = (Get-Command gpg).Source
          if ($gpg -ne "$env:RUNNER_TEMP\gnupg\bin\gpg.exe") { throw "gpg on PATH is $gpg" }
      # The lint job runs on Linux only; this catches warnings in Windows-only code.
      - name: Clippy (Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --all-targets --release -- -D warnings
      - run: cargo test --release
      # The Windows service end to end, like the Docker smoke test: install it from where a
      # deployment would put it, start it, stop it, and check it stopped cleanly and that only
      # its account (plus LocalSystem and Administrators) can access the data. The runner is an
      # administrator, as `service install` needs.
      - name: Smoke test the Windows service
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --bin watermelon
          $dir = "$env:ProgramFiles\WatermelonPGP"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\watermelon.exe $dir
          $wm = "$dir\watermelon.exe"
          $data = "$env:ProgramData\WatermelonPGP"
          $account = 'NT SERVICE\watermelon'

          "ci smoke test password" | & $wm --data-dir $data --passphrase-stdin init
          # A non-default port: proves the settings reach the service.
          & $wm --data-dir $data service install --bind 127.0.0.1:18080
          $service = Get-CimInstance Win32_Service -Filter "Name='watermelon'"
          if ($service.StartName -ne $account) { throw "runs as $($service.StartName)" }

          function Wait-Healthy {
            for ($i = 0; $i -lt 30; $i++) {
              try {
                if ((Invoke-WebRequest http://127.0.0.1:18080/healthz).Content -match '"ok"') { return }
              } catch { Start-Sleep 1 }
            }
            throw "/healthz did not answer"
          }
          Start-Service watermelon
          Wait-Healthy

          Stop-Service watermelon
          $service = Get-CimInstance Win32_Service -Filter "Name='watermelon'"
          if ($service.State -ne 'Stopped' -or $service.ExitCode -ne 0) {
            throw "state $($service.State), exit code $($service.ExitCode)/$($service.ServiceSpecificExitCode)"
          }
          $log = Get-Content "$data\watermelon.log" -Raw
          Write-Output $log
          foreach ($line in 'serving', 'running jobs finish their current file first', 'stopped') {
            if ($log -notmatch [regex]::Escape($line)) { throw "the log lacks '$line'" }
          }

          # The data directory and everything in it, including files the service created.
          $allowed = $account, 'NT AUTHORITY\SYSTEM', 'BUILTIN\Administrators'
          foreach ($item in @(Get-Item $data) + @(Get-ChildItem $data -Recurse -Force)) {
            $acl = Get-Acl $item.FullName
            $who = @($acl.Access | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
            Write-Output "$($item.Name): owner $($acl.Owner); $($who -join ', ')"
            if ($acl.Owner -ne $account) { throw "$($item.FullName) is owned by $($acl.Owner)" }
            $others = $who | Where-Object { $_ -notin $allowed }
            if ($others) { throw "$($item.FullName) also allows $($others -join ', ')" }
            if ($account -notin $who) { throw "$($item.FullName) doesn't allow $account" }
          }

          # An administrator can still run commands on the service's data.
          & $wm --data-dir $data audit --limit 3

          # Uninstalling a running service stops it first, cleanly.
          Start-Service watermelon
          Wait-Healthy
          & $wm service uninstall
          if (Get-Service watermelon -ErrorAction SilentlyContinue) { throw "still installed" }
          $stops = [regex]::Matches((Get-Content "$data\watermelon.log" -Raw), 'INFO stopped').Count
          if ($stops -ne 2) { throw "expected 2 clean stops in the log, found $stops" }
      - name: Windows service log and events
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content "$env:ProgramData\WatermelonPGP\watermelon.log" -ErrorAction SilentlyContinue
          Get-WinEvent -LogName System -MaxEvents 20 -FilterXPath "*[System[Provider[@Name='Service Control Manager']]]" -ErrorAction SilentlyContinue | Format-List TimeCreated, Message

  # Further GnuPG versions partners are likely to run: 2.2 (Debian 12) and the newest 2.4.
  test-gnupg:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "debian:testing"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools and GnuPG
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl build-essential git gnupg gpg-agent
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.image }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: gpg --version
      - run: cargo test --release

  # The core user flows in a real browser (Playwright, Chromium) against a real binary.
  # Debug build, so the style guide is checked too.
  e2e:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - name: Keep the report and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  # The oldest Rust the workspace claims to support (rust-version in Cargo.toml).
  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  # Known vulnerabilities in dependencies (RustSec advisory database).
  audit:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  docker:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t watermelon-pgp:ci .
      - name: Smoke test the image
        run: |
          echo "ci smoke test password" \
            | docker run --rm -i -v wm-data:/data watermelon-pgp:ci --passphrase-stdin init
          docker run -d --name wm -p 127.0.0.1:8080:8080 -v wm-data:/data watermelon-pgp:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/healthz | grep -q '"ok"'
          test "$(docker exec wm id -u)" = 10001
          docker stop wm
          docker logs wm
          test "$(docker inspect wm --format '{{.State.ExitCode}}')" = 0

  # The one check to require in the ruleset: green when every job passed or was skipped
  # because the change can't affect it, red when any job failed, was cancelled or timed out.
  # It reads every job of this run attempt from the API rather than `needs.<job>.result`:
  # that is one value per matrix job, and a cancelled leg (no macOS runner, say) didn't show
  # there (#31). A re-run attempt lists the jobs it carried over too. `needs` only orders it
  # after the others, so it must list every job: one left out could still be running.
  ci-ok:
    needs: [changes, lint, test, test-gnupg, e2e, msrv, audit, docker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Fail unless every job passed or was skipped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --paginate --jq ".jobs[] | select(.name != \"$GITHUB_JOB\") | \"\\(.conclusion // .status)\\t\\(.name)\"")
          printf '%s\n' "$jobs"
          test -n "$jobs" || { echo "No jobs listed for this run."; exit 1; }
          bad=$(printf '%s\n' "$jobs" | awk -F'\t' '$1 != "success" && $1 != "skipped"')
          if [ -n "$bad" ]; then
            echo "Not every job passed:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All jobs passed or were skipped."
