[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tarannum22/watermelon-pgp"
rust-version = "1.89"

[workspace.dependencies]
watermelon-pgp-core = { path = "crates/watermelon-pgp-core" }
watermelon-pgp-jobs = { path = "crates/watermelon-pgp-jobs" }
watermelon-pgp-web = { path = "crates/watermelon-pgp-web" }
pgp = "0.21.1"
rand = "0.8.6"
rsa = "0.9"
smallvec = "1.16"
bytes = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
chacha20poly1305 = "0.10.1"
argon2 = { version = "0.5.3", features = ["std"] }
zeroize = "1.9"
hex = "0.4"
sha2 = "0.10"
ctrlc = { version = "3.5", features = ["termination"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
rpassword = "7.5"
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "form", "query", "multipart"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "signal", "macros", "sync"] }
maud = { version = "0.27", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_html_form = "0.4.1"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
# ring rather than aws-lc-rs: builds without cmake or a C++ toolchain.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "json", "env-filter"] }
rcgen = "0.14.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
