name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The GnuPG interop tests are a release gate: fail instead of skipping when gpg is missing.
  WATERMELON_REQUIRE_GPG: "1"

jobs:
  # Which parts of the repository a pull request touches. Pushes to main and tags skip the
  # filter and run every job. Website-only changes are checked by pages.yml.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".cargo/**"
              - ".github/workflows/ci.yml"
            e2e:
              - "e2e/**"
            docker:
              - "Dockerfile"
              - ".dockerignore"
              - "contrib/**"

  lint:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --release -- -D warnings
      # Debug builds add the /styleguide page.
      - run: cargo clippy --all-targets -- -D warnings

  # Runner images: Ubuntu 24.04 (GnuPG 2.4.4), latest Ubuntu (GnuPG 2.4.8 + libgcrypt 1.12.0,
  # see README "Known issues"), macOS (current GnuPG from Homebrew).
  test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GnuPG (macOS)
        if: runner.os == 'macOS'
        run: brew install gnupg
      - run: gpg --version
      - run: cargo test --release

  # Further GnuPG versions partners are likely to run: 2.2 (Debian 12) and the newest 2.4.
  # Never skipped when Rust code changes: these are the GnuPG release gate.
  test-gnupg:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "debian:testing"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools and GnuPG
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl build-essential git gnupg gpg-agent
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: gpg --version
      - run: cargo test --release

  # The core user flows in a real browser (Playwright, Chromium) against a real binary.
  # Debug build, so the style guide is checked too.
  e2e:
    needs: changes
    if: >-
      github.event_name != 'pull_request'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - name: Keep the report and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  # The oldest Rust the workspace claims to support (rust-version in Cargo.toml).
  msrv:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --workspace --all-targets --locked

  # Known vulnerabilities in dependencies (RustSec advisory database).
  audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  docker:
    needs: changes
    if: >-
      github.event_name != 'pull_request'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t watermelon-pgp:ci .
      - name: Smoke test the image
        run: |
          echo "ci smoke test password" \
            | docker run --rm -i -v wm-data:/data watermelon-pgp:ci --passphrase-stdin init
          docker run -d --name wm -p 127.0.0.1:8080:8080 -v wm-data:/data watermelon-pgp:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/healthz | grep -q '"ok"'
          test "$(docker exec wm id -u)" = 10001
          docker stop wm
          docker logs wm
          test "$(docker inspect wm --format '{{.State.ExitCode}}')" = 0

  # The one check to require in the ruleset: green when every job passed or was skipped
  # because the change can't affect it, red when any job failed or was cancelled.
  ci-ok:
    needs: [changes, lint, test, test-gnupg, e2e, msrv, audit, docker]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Some jobs failed or were cancelled."
          exit 1
      - run: echo "All needed jobs passed or were skipped."
